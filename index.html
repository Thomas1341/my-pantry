<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>綠意食光 v8.1 - 精準對齊版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <style>
        :root { --primary: #E0F79C; }
        body { background-color: #FAFAFA; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .bg-primary { background-color: var(--primary); }
        .card { border-radius: 24px; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #F0F0F0; }
        
        /* 核心修復：確保掃描容器比例與相機流一致 */
        #interactive.viewport { 
            position: relative; 
            width: 100%; 
            height: 300px; /* 增加高度以便操作 */
            border-radius: 24px; 
            overflow: hidden; 
            background: #000;
        }
        /* 讓影像置中且填滿，避免偏移 */
        #interactive.viewport video, #interactive.viewport canvas { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            min-width: 100%; 
            min-height: 100%; 
            object-fit: cover; 
        }
        /* 視覺導引框：提示使用者將條碼放在正中心 */
        .scan-guide { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 70%; 
            height: 40%; 
            border: 3px solid var(--primary); 
            z-index: 20; 
            border-radius: 12px; 
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.6); 
            pointer-events: none; 
        }
        .scan-guide::after {
            content: "將條碼置於框內正中央";
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFF;
            font-size: 12px;
            width: 150px;
            text-align: center;
        }
        canvas.drawingBuffer { display: none; }
    </style>
</head>
<body class="pb-32">

    <header class="p-8 bg-primary rounded-b-[50px] shadow-sm mb-4">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-gray-800">綠意食光</h1>
                <p id="stats" class="text-xs text-gray-600 font-medium">中心對齊優化版</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportData()" class="bg-white/60 p-3 rounded-2xl text-xl">📤</button>
                <label class="bg-white/60 p-3 rounded-2xl text-xl cursor-pointer">
                    📥<input type="file" class="hidden" onchange="importData(event)">
                </label>
            </div>
        </div>
    </header>

    <div class="px-6 mb-6">
        <select id="sortMode" onchange="renderList()" class="w-full bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-sm font-bold text-gray-700 outline-none">
            <option value="expiryNear">到期日：由近到遠</option>
            <option value="expiryFar">到期日：由遠到近</option>
            <option value="stroke">名稱：筆劃排序</option>
        </select>
    </div>

    <div id="foodList" class="px-6 space-y-4"></div>

    <div class="fixed bottom-0 left-0 right-0 p-6 bg-white/80 backdrop-blur-xl flex justify-center border-t border-gray-100 z-50">
        <button onclick="openScanner()" class="bg-primary w-full max-w-xs py-4 rounded-[2rem] font-bold shadow-xl text-gray-800 text-lg active:scale-95 transition-transform">
            🔍 掃描新食品
        </button>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/90 hidden z-[60] flex flex-col items-center justify-end">
        <div class="bg-white w-full max-w-md rounded-t-[40px] p-8 animate-up overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">添加食品</h2>
                <button onclick="closeModal()" class="text-gray-400 text-3xl">✕</button>
            </div>

            <div id="scannerSection" class="space-y-4">
                <div id="interactive" class="viewport">
                    <div class="scan-guide"></div>
                </div>
                <div class="flex gap-2">
                    <p id="status" class="flex-1 text-sm text-gray-400 italic py-2">等待辨識中...</p>
                    <label class="bg-gray-100 px-4 py-2 rounded-xl text-xs font-bold text-gray-600 cursor-pointer">
                        📸 拍照辨識
                        <input type="file" accept="image/*" capture="camera" class="hidden" onchange="decodeFile(event)">
                    </label>
                </div>
            </div>

            <div class="mt-6 space-y-4">
                <input type="text" id="foodName" placeholder="產品名稱" class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-primary font-bold text-lg">
                <div class="grid grid-cols-2 gap-4">
                    <select id="foodQty" class="p-4 rounded-2xl bg-gray-50 border-none">
                        <script>for(let i=1;i<=10;i++) document.write(`<option value="${i}">${i} 份</option>`)</script>
                    </select>
                    <input type="date" id="expiryDate" class="p-4 rounded-2xl bg-gray-50 border-none">
                </div>
                <button onclick="saveFood()" class="w-full py-5 bg-primary rounded-3xl font-black shadow-lg text-gray-800">儲存紀錄</button>
            </div>
            <input type="hidden" id="currentBarcode">
        </div>
    </div>

    <script>
        let foods = JSON.parse(localStorage.getItem('myFoods')) || [];
        let barcodeHistory = JSON.parse(localStorage.getItem('barcodeHistory')) || {};

        window.onload = () => { renderList(); checkUrgentItems(); };

        function openScanner() {
            document.getElementById('modal').classList.remove('hidden');
            
            // 使用專為行動端優化的配置
            const config = {
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#interactive'),
                    constraints: {
                        width: { min: 640 },
                        height: { min: 480 },
                        facingMode: "environment",
                        aspectRatio: { min: 1, max: 2 }
                    },
                },
                locator: {
                    patchSize: "medium",
                    halfSample: true
                },
                decoder: {
                    readers: ["ean_reader", "ean_8_reader", "code_128_reader"]
                },
                locate: true
            };

            Quagga.init(config, (err) => {
                if (err) { alert("啟動失敗: " + err); return; }
                Quagga.start();
                document.getElementById('status').innerText = "請將條碼對準綠色框中心";
            });

            Quagga.onDetected((res) => {
                const code = res.codeResult.code;
                if (code) {
                    if (navigator.vibrate) navigator.vibrate(80);
                    handleCodeDetected(code);
                    Quagga.stop();
                }
            });
        }

        async function handleCodeDetected(code) {
            document.getElementById('currentBarcode').value = code;
            if (barcodeHistory[code]) {
                document.getElementById('foodName').value = barcodeHistory[code];
                document.getElementById('status').innerText = "✅ 已自動套用您的學習紀錄";
                return;
            }

            document.getElementById('status').innerText = "查詢中: " + code;
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_zh,brands,generic_name_zh`);
                const data = await res.json();
                if (data.status === 1) {
                    const p = data.product;
                    const name = p.product_name_zh || p.generic_name_zh || p.product_name || p.brands || "未知食品";
                    document.getElementById('foodName').value = name;
                    document.getElementById('status').innerText = "✅ 辨識完成";
                }
            } catch (e) {
                document.getElementById('status').innerText = "請手動輸入名稱";
            }
        }

        // --- 拍照辨識備案 ---
        function decodeFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('status').innerText = "照片解析中...";
            Quagga.decodeSingle({
                src: URL.createObjectURL(file),
                decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] },
                locate: true
            }, (res) => {
                if (res && res.codeResult) handleCodeDetected(res.codeResult.code);
                else alert("無法辨識，請確保條碼清晰無反光");
            });
        }

        function saveFood() {
            const name = document.getElementById('foodName').value;
            const expiry = document.getElementById('expiryDate').value;
            const qty = document.getElementById('foodQty').value;
            const code = document.getElementById('currentBarcode').value;
            if (!name || !expiry) return alert("請填寫名稱與日期");

            if (code) {
                barcodeHistory[code] = name;
                localStorage.setItem('barcodeHistory', JSON.stringify(barcodeHistory));
            }
            foods.push({ id: Date.now(), name, qty, expiry });
            localStorage.setItem('myFoods', JSON.stringify(foods));
            renderList();
            closeModal();
        }

        function renderList() {
            const div = document.getElementById('foodList');
            const mode = document.getElementById('sortMode').value;
            const today = new Date();
            const twoWeeks = new Date(); twoWeeks.setDate(today.getDate() + 14);

            let sorted = [...foods].sort((a,b) => {
                if (mode === 'expiryNear') return new Date(a.expiry) - new Date(b.expiry);
                if (mode === 'expiryFar') return new Date(b.expiry) - new Date(a.expiry);
                if (mode === 'stroke') return a.name.localeCompare(b.name, 'zh-Hant');
            });

            const urgent = sorted.filter(i => new Date(i.expiry) <= twoWeeks);
            const others = sorted.filter(i => new Date(i.expiry) > twoWeeks);
            const final = [...urgent, ...others];

            div.innerHTML = final.map(item => {
                const d = Math.ceil((new Date(item.expiry) - today) / 86400000);
                const color = d <= 7 ? 'border-l-red-400' : (d <= 14 ? 'border-l-yellow-300' : 'border-l-[#E0F79C]');
                return `
                    <div class="card p-6 flex justify-between items-center border-l-[10px] ${color}">
                        <div>
                            <h3 class="font-bold text-gray-800">${item.name} <span class="text-xs text-gray-400">x${item.qty}</span></h3>
                            <p class="text-xs ${d <= 14 ? 'text-red-500 font-bold' : 'text-gray-400'}">到期: ${item.expiry} (${d}天後)</p>
                        </div>
                        <button onclick="deleteFood(${item.id})" class="text-gray-200 text-xl px-2">✕</button>
                    </div>
                `;
            }).join('');
            document.getElementById('stats').innerText = `總共: ${foods.length} 項 | 近期到期: ${urgent.length} 項`;
        }

        function checkUrgentItems() {
            const today = new Date();
            const twoWeeks = new Date(); twoWeeks.setDate(today.getDate() + 14);
            const count = foods.filter(i => new Date(i.expiry) <= twoWeeks).length;
            if (count > 0) alert(`🌿 您有 ${count} 項食品即將到期，請檢查清單！`);
        }

        function deleteFood(id) {
            if(confirm('移除此項？')) {
                foods = foods.filter(f => f.id !== id);
                localStorage.setItem('myFoods', JSON.stringify(foods));
                renderList();
            }
        }

        function closeModal() { Quagga.stop(); document.getElementById('modal').classList.add('hidden'); }

        function exportData() {
            const blob = new Blob([JSON.stringify({foods, barcodeHistory})], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `綠意食光_iCloud備份.json`;
            a.click();
            alert("備份已導出，請存入 iCloud Drive。");
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const data = JSON.parse(ev.target.result);
                foods = data.foods; barcodeHistory = data.barcodeHistory;
                localStorage.setItem('myFoods', JSON.stringify(foods));
                localStorage.setItem('barcodeHistory', JSON.stringify(barcodeHistory));
                renderList();
            };
            reader.readAsText(e.target.files[0]);
        }
    </script>
</body>
</html>
