<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>綠意食光 v9.0 - 高精度智能版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <style>
        :root { --primary: #E0F79C; }
        body { background-color: #FAFAFA; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .bg-primary { background-color: var(--primary); }
        .card { border-radius: 24px; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #F0F0F0; }
        
        /* 核心修復：高精度視窗對齊 */
        #interactive.viewport { 
            position: relative; 
            width: 100%; 
            height: 280px;
            border-radius: 28px; 
            overflow: hidden; 
            background: #000;
        }
        #interactive.viewport video, #interactive.viewport canvas { 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            min-width: 100%; min-height: 100%; 
            object-fit: cover; 
        }
        
        /* 視覺引導框：對應代碼中的 area 區域 */
        .scan-guide { 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            width: 80%; height: 40%; 
            border: 3px solid var(--primary); 
            z-index: 20; border-radius: 16px; 
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.6); 
            pointer-events: none; 
        }
        .scan-guide::after {
            content: "連續鎖定中...";
            position: absolute; bottom: -35px; left: 50%;
            transform: translateX(-50%); color: var(--primary);
            font-size: 12px; font-weight: bold; width: 200px; text-align: center;
        }
        canvas.drawingBuffer { display: none; }
    </style>
</head>
<body class="pb-32">

    <header class="p-8 bg-primary rounded-b-[50px] shadow-sm mb-4">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-2xl font-black text-gray-800">Buy&Eat</h1>
                <p id="stats" class="text-xs text-gray-600 font-medium">系統已優化穩定解碼</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportData()" class="bg-white/60 p-3 rounded-2xl shadow-sm text-xl active:scale-90 transition-transform">📤</button>
                <label class="bg-white/60 p-3 rounded-2xl shadow-sm text-xl cursor-pointer active:scale-90 transition-transform">
                    📥<input type="file" class="hidden" onchange="importData(event)">
                </label>
            </div>
        </div>
    </header>

    <div class="px-6 mb-6">
        <div class="bg-white rounded-2xl p-2 shadow-sm border border-gray-100 flex items-center">
            <span class="text-[10px] font-black text-gray-400 px-3 uppercase tracking-widest">Sort By</span>
            <select id="sortMode" onchange="renderList()" class="flex-1 bg-transparent py-3 pr-8 text-sm font-bold text-gray-700 outline-none">
                <option value="expiryNear">到期日：由近到遠 (優先吃掉)</option>
                <option value="expiryFar">到期日：由遠到近 (長期存放)</option>
                <option value="stroke">名稱：筆劃由少至多</option>
            </select>
        </div>
    </div>

    <div id="foodList" class="px-6 space-y-4"></div>

    <div class="fixed bottom-0 left-0 right-0 p-6 bg-white/80 backdrop-blur-xl flex justify-center border-t border-gray-50 z-50">
        <button onclick="openScanner()" class="bg-primary w-full max-w-xs py-4 rounded-[2rem] font-bold shadow-xl text-gray-800 text-lg active:scale-95 transition-all">
            🔍 掃描條碼存檔
        </button>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/90 hidden z-[60] flex flex-col items-center justify-end">
        <div class="bg-white w-full max-w-md rounded-t-[40px] p-8 animate-up overflow-y-auto max-h-[95vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">偵測食品中</h2>
                <button onclick="closeModal()" class="text-gray-300 text-4xl p-2 leading-none">×</button>
            </div>

            <div id="scannerSection" class="space-y-4">
                <div id="interactive" class="viewport"><div class="scan-guide"></div></div>
                <div class="flex gap-2">
                    <div id="status" class="flex-1 text-xs font-bold text-gray-400 bg-gray-50 p-3 rounded-xl border border-gray-100 italic">
                        請對準條碼...
                    </div>
                    <label class="bg-gray-800 px-4 py-3 rounded-xl text-xs font-bold text-white cursor-pointer active:opacity-80">
                        📸 拍照辨識
                        <input type="file" accept="image/*" capture="camera" class="hidden" onchange="decodeFile(event)">
                    </label>
                </div>
            </div>

            <div class="mt-8 space-y-5">
                <div>
                    <label class="text-[10px] font-black text-gray-400 ml-1 uppercase">Product Name</label>
                    <input type="text" id="foodName" placeholder="點擊手動輸入品名" class="w-full p-4 mt-1 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-primary font-black text-lg text-gray-700">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-gray-400 ml-1 uppercase">Quantity</label>
                        <select id="foodQty" class="w-full p-4 mt-1 rounded-2xl bg-gray-50 border-none outline-none font-bold text-gray-700">
                            <script>for(let i=1;i<=20;i++) document.write(`<option value="${i}">${i} 份</option>`)</script>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-gray-400 ml-1 uppercase">Expiry Date</label>
                        <input type="date" id="expiryDate" class="w-full p-4 mt-1 rounded-2xl bg-gray-50 border-none outline-none font-bold text-gray-700">
                    </div>
                </div>

                <button onclick="saveFood()" class="w-full py-5 bg-primary rounded-3xl font-black shadow-lg text-gray-800 mt-2 active:scale-95 transition-transform uppercase tracking-widest">確認加入糧倉</button>
            </div>
            <input type="hidden" id="currentBarcode">
        </div>
    </div>

    <script>
        let foods = JSON.parse(localStorage.getItem('myFoods')) || [];
        let barcodeHistory = JSON.parse(localStorage.getItem('barcodeHistory')) || {};
        
        // Voting System 變數
        let lastDetectedCode = null;
        let detectionCount = 0;
        const CONFIRM_THRESHOLD = 3; // 連續辨識 3 次成功才採用

        window.onload = () => { renderList(); checkUrgentItems(); };

        function openScanner() {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('foodName').value = "";
            document.getElementById('currentBarcode').value = "";
            lastDetectedCode = null;
            detectionCount = 0;

            const config = {
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#interactive'),
                    constraints: {
                        width: 1280, height: 720, // 高清採樣
                        facingMode: "environment"
                    },
                    // 優化 1：限制掃描區域 (ROI)，僅掃描中心 40% 高度的區域
                    area: { top: "30%", right: "10%", left: "10%", bottom: "30%" }
                },
                numOfWorkers: navigator.hardwareConcurrency || 4,
                locator: { patchSize: "medium", halfSample: true },
                decoder: {
                    readers: ["ean_reader", "ean_8_reader", "code_128_reader"],
                    multiple: false
                },
                locate: true
            };

            Quagga.init(config, (err) => {
                if (err) { document.getElementById('status').innerText = "啟動相機失敗"; return; }
                Quagga.start();
                document.getElementById('status').innerText = "系統已就緒，偵測中...";
            });

            Quagga.onDetected((res) => {
                const code = res.codeResult.code;
                if (!code) return;

                // 優化 2：Voting System (連續驗證機制)
                if (code === lastDetectedCode) {
                    detectionCount++;
                } else {
                    lastDetectedCode = code;
                    detectionCount = 1;
                }

                if (detectionCount >= CONFIRM_THRESHOLD) {
                    if (navigator.vibrate) navigator.vibrate(80);
                    handleCodeDetected(code);
                    Quagga.stop();
                    detectionCount = 0;
                } else {
                    document.getElementById('status').innerText = `正在鎖定: ${code} (${detectionCount}/${CONFIRM_THRESHOLD})`;
                }
            });
        }

        async function handleCodeDetected(code) {
            document.getElementById('currentBarcode').value = code;
            
            // 優先檢查學習紀錄
            if (barcodeHistory[code]) {
                document.getElementById('foodName').value = barcodeHistory[code];
                document.getElementById('status').innerText = "✅ 已載入您的記憶紀錄";
                return;
            }

            document.getElementById('status').innerText = "正在搜尋雲端資料庫...";
            try {
                // 強化 API 欄位
                const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_zh,brands,generic_name_zh`);
                const data = await res.json();
                
                if (data.status === 1) {
                    const p = data.product;
                    let name = p.product_name_zh || p.generic_name_zh || p.product_name || (p.brands ? p.brands : "");
                    document.getElementById('foodName').value = name;
                    document.getElementById('status').innerText = "✅ 辨識成功！";
                } else {
                    document.getElementById('foodName').value = "條碼: " + code;
                    document.getElementById('status').innerText = "新食品！請輸入品名";
                }
            } catch (e) {
                document.getElementById('foodName').value = "條碼: " + code;
                document.getElementById('status').innerText = "網路異常，請手動输入";
            }
        }

        function decodeFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('status').innerText = "深度解析照片中...";
            Quagga.decodeSingle({
                src: URL.createObjectURL(file),
                decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader"] },
                locate: true
            }, (res) => {
                if (res && res.codeResult) handleCodeDetected(res.codeResult.code);
                else alert("無法辨識，請確保條碼清晰無反光。");
            });
        }

        function saveFood() {
            const name = document.getElementById('foodName').value;
            const expiry = document.getElementById('expiryDate').value;
            const qty = document.getElementById('foodQty').value;
            const code = document.getElementById('currentBarcode').value;
            
            if (!name || !expiry) return alert("請完整填寫產品名稱與日期");

            // 學習機制
            if (code) {
                barcodeHistory[code] = name;
                localStorage.setItem('barcodeHistory', JSON.stringify(barcodeHistory));
            }

            foods.push({ id: Date.now(), name, qty, expiry });
            localStorage.setItem('myFoods', JSON.stringify(foods));
            renderList();
            closeModal();
        }

        function renderList() {
            const div = document.getElementById('foodList');
            const mode = document.getElementById('sortMode').value;
            const today = new Date();
            const twoWeeks = new Date(); twoWeeks.setDate(today.getDate() + 14);

            let sorted = [...foods].sort((a,b) => {
                if (mode === 'expiryNear') return new Date(a.expiry) - new Date(b.expiry);
                if (mode === 'expiryFar') return new Date(b.expiry) - new Date(a.expiry);
                if (mode === 'stroke') return a.name.localeCompare(b.name, 'zh-Hant');
            });

            // 兩週內置頂
            const urgent = sorted.filter(i => new Date(i.expiry) <= twoWeeks);
            const others = sorted.filter(i => new Date(i.expiry) > twoWeeks);
            const final = [...urgent, ...others];

            div.innerHTML = final.map(item => {
                const diff = Math.ceil((new Date(item.expiry) - today) / 86400000);
                const isUrgent = diff <= 14;
                const cardColor = diff <= 7 ? 'border-l-red-400' : (isUrgent ? 'border-l-yellow-300' : 'border-l-[#E0F79C]');
                
                return `
                    <div class="card p-6 flex justify-between items-center border-l-[12px] ${cardColor}">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800 text-lg">${item.name} <span class="text-xs text-gray-300 ml-2">x${item.qty}</span></h3>
                            <p class="text-xs ${isUrgent ? 'text-red-500 font-bold' : 'text-gray-400'} mt-1">
                                ${isUrgent ? '⚠️ ' : ''}到期日：${item.expiry} (${diff} 天後)
                            </p>
                        </div>
                        <button onclick="deleteFood(${item.id})" class="text-gray-200 hover:text-red-400 p-2 text-2xl transition-colors">✕</button>
                    </div>
                `;
            }).join('');
            document.getElementById('stats').innerText = `${foods.length} 樣存貨 | ${urgent.length} 樣即將到期`;
        }

        function checkUrgentItems() {
            const today = new Date();
            const twoWeeks = new Date(); twoWeeks.setDate(today.getDate() + 14);
            const urgentCount = foods.filter(i => new Date(i.expiry) <= twoWeeks).length;
            if (urgentCount > 0) {
                setTimeout(() => alert(`🌿 您有 ${urgentCount} 項食品即將到期，請檢查置頂清單！`), 500);
            }
        }

        function deleteFood(id) {
            if(confirm('確定要移除此食品嗎？')) {
                foods = foods.filter(f => f.id !== id);
                localStorage.setItem('myFoods', JSON.stringify(foods));
                renderList();
            }
        }

        function closeModal() { Quagga.stop(); document.getElementById('modal').classList.add('hidden'); }

        function exportData() {
            const blob = new Blob([JSON.stringify({foods, barcodeHistory})], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `綠意食光_備份_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            alert("✅ 備份檔已產生！\n請存入 iCloud Drive。");
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const data = JSON.parse(ev.target.result);
                foods = data.foods || [];
                barcodeHistory = data.barcodeHistory || {};
                localStorage.setItem('myFoods', JSON.stringify(foods));
                localStorage.setItem('barcodeHistory', JSON.stringify(barcodeHistory));
                renderList();
                alert("🎉 資料載入成功！");
            };
            reader.readAsText(e.target.files[0]);
        }
    </script>
</body>
</html>
